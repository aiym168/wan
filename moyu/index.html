<script>
(function(){var PATH='/moyu/',PROBE='/moyu/assets/favicon.png',MODE='frame',K='be_moyu',done=false,seen={},left=0,lists=2;
function $(i){return document.getElementById(i)}
function target(u){var q=new URLSearchParams(location.search),r=(q.get('r')||'').replace(/[^\w-]/g,'');if(MODE==='go'&&r)return u+PATH+'lobby/'+r;return u+PATH}
function open(u){if(done)return;done=true;try{localStorage.setItem(K,u)}catch(e){}
 if(MODE==='go'){location.replace(target(u));return}
 var f=$('f');f.onload=function(){f.classList.add('on');$('s').classList.add('off');$('back').style.display='block'};f.src=target(u);
 setTimeout(function(){f.classList.add('on');$('s').classList.add('off');$('back').style.display='block'},6000)}
function fin(){if(!done&&lists===0&&left===0){$('m').textContent='服务器正在休息或更换地址，通常几分钟内自动恢复。';$('bar').style.display='none';

function probe(u){if(!u||seen[u]||done||/lhr\.life/.test(u))return;seen[u]=1;left++;

 img.onload=function(){clearTimeout(t);left--;open(u)};img.onerror=function(){clearTimeout(t);left--;fin()};img.src=u+PROBE+'?t='+Date.now()}
function list(src){fetch(src+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){(d.urls||[]).concat(d.primary?[d.primary]:[],d.mirrors||[]).forEach(function(u){probe(String(u).replace(/\/$/,''))})}).catch(function(){}).then(function(){lists--;fin()})}
try{probe(localStorage.getItem(K))}catch(e){}
probe('https://aiym.dpdns.org');list(new URL('live.json',location.href).href);list('https://aiym168.github.io/api/live.json');
